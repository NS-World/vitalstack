<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VitalStack Logo Options</title>
<style>
:root { --bg: #f4f6f9; --card: #fff; --text: #1b1f27; --muted: #5b6575; --border: #e3e7ee; --dark: #1d2330; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
header { padding: 32px 16px 8px; max-width: 1180px; margin: 0 auto; }
h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: -.02em; }
header p { margin: 0; color: var(--muted); }
.grid { max-width: 1180px; margin: 0 auto; padding: 20px 16px 48px; display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 18px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
.num { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; background: var(--text); color: #fff; font-weight: 800; font-size: 14px; margin-right: 8px; }
.title { display: flex; align-items: center; padding: 14px 16px 0; font-weight: 800; font-size: 17px; }
.why { margin: 6px 16px 12px; color: var(--muted); font-size: 14px; line-height: 1.5; }
.stage { display: flex; align-items: center; gap: 10px; padding: 22px 18px; }
.stage.light { background: #fff; border-top: 1px solid var(--border); }
.stage.dark { background: var(--dark); }
.word { font-weight: 800; font-size: 26px; letter-spacing: -.02em; color: #1b1f27; }
.dark .word { color: #f3f5f8; }
.word b { font-weight: 800; color: var(--accent); }
.dark .word b { color: var(--glow); }
.mark { width: 44px; height: 44px; flex-shrink: 0; }
.sizes { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); background: #fafbfc; }
.sizes svg { display: block; }
.tab { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; background: #e9ecf1; border-radius: 8px 8px 0 0; color: #1b1f27; font-size: 12px; }
</style>
</head>
<body>
<header>
	<h1>VitalStack: choose a logo</h1>
	<p>Eight directions. Each one is shown in the header on light and dark, and as a browser-tab icon. Reply with the number you like (or "mix 2 and 6").</p>
</header>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
	<defs>
		<!-- 1 Layers -->
		<symbol id="m1" viewBox="0 0 48 48"><rect width="48" height="48" rx="12" fill="#0a7d4f"/><g fill="none" stroke="#fff" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"><path d="M24 10.5 37.5 18 24 25.5 10.5 18Z"/><path d="M10.5 24.5 24 32 37.5 24.5"/><path d="M10.5 31 24 38.5 37.5 31"/></g></symbol>
		<!-- 2 Code pulse -->
		<symbol id="m2" viewBox="0 0 48 48"><rect width="48" height="48" rx="12" fill="#1d2330"/><g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.2"><path d="M14 15 6.5 24 14 33" stroke="#34c987"/><path d="M34 15 41.5 24 34 33" stroke="#34c987"/><path d="M13 24h6l3-7 4.5 14 3-7H35" stroke="#fff"/></g></symbol>
		<!-- 3 VS monogram -->
		<symbol id="m3" viewBox="0 0 48 48"><circle cx="24" cy="24" r="24" fill="#0a7d4f"/><g fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 15 16.5 33 23.5 15"/><path d="M38 17.5c-1.6-2-4.2-2.8-6.6-2.4-2.8.5-4.4 2.6-3.9 4.9.9 4.3 11 3.4 11 8.6 0 3.3-3.4 5-6.7 4.7-2.4-.2-4.3-1.3-5.3-3"/></g></symbol>
		<!-- 4 Growth bars -->
		<symbol id="m4" viewBox="0 0 48 48"><defs><linearGradient id="g4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34c987"/><stop offset="1" stop-color="#0a7d4f"/></linearGradient></defs><rect width="48" height="48" rx="12" fill="url(#g4)"/><rect x="10" y="27" width="7" height="11" rx="2" fill="#fff" opacity=".7"/><rect x="20.5" y="20" width="7" height="18" rx="2" fill="#fff" opacity=".85"/><rect x="31" y="12" width="7" height="26" rx="2" fill="#fff"/><circle cx="34.5" cy="8" r="0" fill="#fff"/></symbol>
		<!-- 5 Terminal stack -->
		<symbol id="m5" viewBox="0 0 48 48"><rect x="7" y="7" width="41" height="41" rx="11" fill="#34c987"/><rect width="41" height="41" rx="11" fill="#1d2330"/><g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.4"><path d="M11 14l7.5 6.5L11 27" stroke="#34c987"/><path d="M22 29h9" stroke="#fff"/></g></symbol>
		<!-- 6 Stacky robot -->
		<symbol id="m6" viewBox="0 0 48 48"><line x1="24" y1="9" x2="24" y2="3.5" stroke="#0a7d4f" stroke-width="3" stroke-linecap="round"/><circle cx="24" cy="3.5" r="3" fill="#f5b301"/><rect x="5" y="9" width="38" height="30" rx="10" fill="#0a7d4f"/><rect x="10" y="14" width="28" height="19" rx="6" fill="#10251c"/><circle cx="18" cy="22" r="3.4" fill="#34c987"/><circle cx="30" cy="22" r="3.4" fill="#34c987"/><path d="M19.5 28c2.8 2.2 6.2 2.2 9 0" fill="none" stroke="#34c987" stroke-width="2.2" stroke-linecap="round"/><rect x="12" y="41" width="24" height="5" rx="2.5" fill="#34c987"/></symbol>
		<!-- 7 Cube -->
		<symbol id="m7" viewBox="0 0 48 48"><path d="M24 5 41 14.5 24 24 7 14.5Z" fill="#34c987"/><path d="M7 14.5 24 24v19L7 33.5Z" fill="#0a7d4f"/><path d="M41 14.5 24 24v19l17-9.5Z" fill="#075c3a"/><path d="M15.5 30.5 12 28l3.5-2.5M33 25.5l3.5 2.5-3.5 2.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
		<!-- 8 Book of code -->
		<symbol id="m8" viewBox="0 0 48 48"><rect width="48" height="48" rx="24" fill="#0a7d4f"/><path d="M9 14.5c5.5-2.5 10.5-2 15 1.5 4.5-3.5 9.5-4 15-1.5v19c-5.5-2.5-10.5-2-15 1.5-4.5-3.5-9.5-4-15-1.5Z" fill="#fff"/><path d="M24 16v19" stroke="#0a7d4f" stroke-width="2"/><g fill="none" stroke="#0a7d4f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21l-3 3.5 3 3.5"/><path d="M31 21l3 3.5-3 3.5"/></g></symbol>
	</defs>
</svg>

<div class="grid" id="grid"></div>

<script>
var options = [
	['m1', 'Layers', 'A clean version of today\'s icon: three stacked layers = the "stack" of skills. Safe, professional, already familiar to your readers.', '#0a7d4f', '#34c987'],
	['m2', 'Code Pulse', 'Code brackets with a heartbeat line: "Vital" (alive, essential) + code. Unique and easy to remember; great for a coding brand.', '#0a7d4f', '#34c987'],
	['m3', 'VS Monogram', 'The initials V and S in a circle. Works well as an app icon and on social media profile pictures.', '#0a7d4f', '#34c987'],
	['m4', 'Growth Bars', 'Three rising bars: learning step by step and levelling up. Matches the XP and streaks features.', '#0a7d4f', '#34c987'],
	['m5', 'Terminal Stack', 'A terminal prompt ">_" with a stacked card behind it. Feels like a developer tool, very "programmer".', '#0a7d4f', '#34c987'],
	['m6', 'Stacky the Robot', 'Your mascot as the logo. Friendly and fun, which suits the games and animations; kids and beginners will love it.', '#0a7d4f', '#34c987'],
	['m7', 'Code Cube', 'A 3D building block with tiny code brackets: "build your skills block by block". Modern and techy.', '#0a7d4f', '#34c987'],
	['m8', 'Book of Code', 'An open book with code brackets: tutorials + coding. Says "learning site" instantly, good for trust and AdSense.', '#0a7d4f', '#34c987']
];
var grid = document.getElementById('grid');
options.forEach(function (o, i) {
	var mark = '<svg class="mark"><use href="#' + o[0] + '"/></svg>';
	var word = '<span class="word">Vital<b>Stack</b></span>';
	var card = document.createElement('section');
	card.className = 'card';
	card.style.setProperty('--accent', o[3]);
	card.style.setProperty('--glow', o[4]);
	card.innerHTML =
		'<div class="title"><span class="num">' + (i + 1) + '</span>' + o[1] + '</div>' +
		'<p class="why">' + o[2] + '</p>' +
		'<div class="stage light">' + mark + word + '</div>' +
		'<div class="stage dark">' + mark + word + '</div>' +
		'<div class="sizes"><span class="tab"><svg width="16" height="16"><use href="#' + o[0] + '"/></svg>VitalStack</span>' +
		'<svg width="32" height="32"><use href="#' + o[0] + '"/></svg>' +
		'<svg width="64" height="64"><use href="#' + o[0] + '"/></svg><span>tab · 32px · 64px</span></div>';
	grid.appendChild(card);
});
</script>
</body>
</html>
